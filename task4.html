<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech Job Portal - Job Seeker Registration</title>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- Google Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
body { font-family:'Roboto', sans-serif; margin:0; background:#f5f6fa; color:#333; }
header, footer { text-align:center; padding:15px 0; background:#1a73e8; color:white; font-weight:500; }
.container { max-width: 800px; margin: 30px auto; background:#fff; padding:30px; border-radius:12px; box-shadow:0 6px 18px rgba(0,0,0,0.1); }
h2 { text-align:center; color:#1a73e8; margin-bottom:20px; }

.form-group { margin-bottom:20px; position:relative; }
label { display:block; font-weight:500; margin-bottom:6px; }
input, select, textarea { width:100%; padding:10px 12px; border:2px solid #dcd6ff; border-radius:6px; font-size:15px; transition: all 0.3s; }
input:focus, select:focus, textarea:focus { border-color:#1a73e8; box-shadow:0 0 5px rgba(26,115,232,0.3); outline:none; }
input.invalid, select.invalid, textarea.invalid { border-color:red; }
button { background:#1a73e8; color:white; border:none; padding:12px 25px; border-radius:6px; font-weight:600; cursor:pointer; transition:0.3s; }
button:hover { background:#155ab6; }

/* Skills highlight */
#skills { padding:10px; border:2px solid #dcd6ff; border-radius:6px; transition:0.3s; }
#skills.highlight { border-color:#1a73e8; background:#e8f0fe; }

/* Relocate cities */
#relocateCities { display:none; }

/* GitHub preview */
#githubPreview { margin-top:6px; font-size:14px; color:#555; }

/* File preview */
#resumePreview { margin-top:6px; font-size:14px; color:#555; }

/* Confirmation */
#confirmation { display:none; text-align:center; font-size:18px; color:green; margin-top:20px; }

/* Responsive */
@media(max-width:768px){ .container { margin:20px; padding:20px; } }
</style>
</head>
<body>

<header>
<h1>Tech Job Portal</h1>
</header>

<div class="container">
    <h2>Job Seeker Registration Form</h2>
    <form id="jobForm" enctype="multipart/form-data">
        <div class="form-group">
            <label>Full Name *</label>
            <input type="text" id="fullName" required>
            <small class="error"></small>
        </div>
        <div class="form-group">
            <label>Date of Birth *</label>
            <input type="date" id="dob" required>
            <small class="error"></small>
        </div>
        <div class="form-group">
            <label>Gender *</label>
            <select id="gender" required>
                <option value="">Select</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>
        </div>
        <div class="form-group">
            <label>Email *</label>
            <input type="email" id="email" required>
            <small class="error"></small>
        </div>
        <div class="form-group">
            <label>Mobile Number *</label>
            <input type="text" id="mobile" placeholder="10 digits" required>
            <small class="error"></small>
        </div>
        <div class="form-group">
            <label>Highest Qualification *</label>
            <select id="qualification" required>
                <option value="">Select</option>
                <option>Bachelor's</option>
                <option>Master's</option>
                <option>PhD</option>
                <option>Diploma</option>
            </select>
        </div>
        <div class="form-group">
            <label>Years of Experience *</label>
            <input type="number" id="experience" min="0" required>
        </div>
        <div class="form-group" id="skills">
            <label>Skills *</label>
            <input type="checkbox" name="skills" value="JavaScript"> JavaScript
            <input type="checkbox" name="skills" value="Python"> Python
            <input type="checkbox" name="skills" value="Java"> Java
            <input type="checkbox" name="skills" value="C++"> C++
            <input type="checkbox" name="skills" value="React"> React
        </div>
        <div class="form-group">
            <label>Resume Upload (PDF, max 5MB) *</label>
            <input type="file" id="resume" accept=".pdf" required>
            <div id="resumePreview"></div>
        </div>
        <div class="form-group">
            <label>Preferred Job Location *</label>
            <input type="text" id="location" required>
        </div>
        <div class="form-group">
            <label>Available to Join From *</label>
            <input type="date" id="joinDate" required>
        </div>
        <div class="form-group">
            <label>Expected Salary *</label>
            <input type="text" id="salary" required placeholder="Numeric only">
            <small class="error"></small>
        </div>
        <div class="form-group">
            <label>GitHub/Portfolio Link</label>
            <input type="text" id="github">
            <div id="githubPreview"></div>
        </div>
        <div class="form-group">
            <label>Willing to Relocate? *</label>
            <input type="radio" name="relocate" value="Yes"> Yes
            <input type="radio" name="relocate" value="No"> No
        </div>
        <div class="form-group" id="relocateCities">
            <label>Preferred Cities *</label>
            <select id="cities">
                <option value="">Select City</option>
                <option>Bangalore</option>
                <option>Hyderabad</option>
                <option>Pune</option>
                <option>Chennai</option>
                <option>Delhi</option>
            </select>
        </div>
        <div style="text-align:center; margin-top:20px;">
            <button type="submit">Submit</button>
        </div>
    </form>

    <div id="confirmation">Registration submitted successfully! Thank you.</div>
</div>

<footer>
Tech Job Portal &copy; 2025
</footer>

<script>
$(document).ready(function(){
    // Skills highlight
    $("#skills").mouseenter(function(){ $(this).addClass("highlight"); })
                .mouseleave(function(){ $(this).removeClass("highlight"); });

    // GitHub live preview
    $("#github").keyup(function(){
        let val=$(this).val();
        $("#githubPreview").text(val ? "Preview: "+val : "");
    });

    // Relocate cities toggle
    $("input[name='relocate']").change(function(){
        if($(this).val()=="Yes") $("#relocateCities").show();
        else $("#relocateCities").hide();
    });

    // File validation
    $("#resume").change(function(){
        const file = this.files[0];
        if(file){
            const sizeMB = file.size/1024/1024;
            const type = file.type;
            if(type!=="application/pdf"){ alert("Only PDF allowed"); $(this).val(""); $("#resumePreview").text(""); return; }
            if(sizeMB>5){ alert("File size must be <=5MB"); $(this).val(""); $("#resumePreview").text(""); return; }
            $("#resumePreview").text("Selected file: "+file.name+" ("+sizeMB.toFixed(2)+" MB)");
        }
    });

    // Salary numeric validation
    $("#salary").blur(function(){
        const val = $(this).val();
        if(isNaN(val) || val<=0){ $(this).addClass("invalid"); $(this).siblings(".error").text("Enter valid numeric salary"); }
        else { $(this).removeClass("invalid"); $(this).siblings(".error").text(""); }
    });

    // Full Name validation: alphabets only
    $("#fullName").on("keyup", function(){ this.value=this.value.replace(/[^a-zA-Z ]/g,''); });

    // Mobile number validation
    $("#mobile").on("keyup", function(){ this.value=this.value.replace(/[^0-9]/g,''); });

    // Form submission
    $("#jobForm").submit(function(e){
        e.preventDefault();
        let valid=true;

        // Required validation
        $("#jobForm [required]").each(function(){
            if(!$(this).val()){ $(this).addClass("invalid"); valid=false; }
            else $(this).removeClass("invalid");
        });

        // Relocate cities required if visible
        if($("#relocateCities").is(":visible") && !$("#cities").val()){ $("#cities").addClass("invalid"); valid=false; }
        else $("#cities").removeClass("invalid");

        if(valid){ 
            $("#jobForm").fadeOut();
            $("#confirmation").fadeIn();
        } else { alert("Please correct highlighted fields."); }
    });
});
</script>

</body>
</html>
