<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech Job Portal - Job Seeker Registration</title>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- Google Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
body { 
    font-family:'Roboto', sans-serif; 
    margin:0; 
    background:#f5f6fa; 
    color:#333; 
} 

header, footer { 
    text-align:center; 
    padding:15px 0; 
    background:#1a73e8; 
    color:white; 
    font-weight:500; 
}

.container { 
    max-width: 800px; 
    margin: 30px auto; 
    background:#fff; 
    padding:30px; 
    border-radius:12px; 
    box-shadow:0 6px 18px rgba(0,0,0,0.1); 
}

h2 { 
    text-align:center; 
    color:#1a73e8; 
    margin-bottom:20px; 
}

.form-group { 
    margin-bottom:20px; 
    position:relative; 
    display:flex; 
    flex-direction: column; 
}
label { 
    display:block; 
    font-weight:500; 
    margin-bottom:6px; 
}

input, textarea, select { 
    padding:10px 12px; 
    border:2px solid #dcd6ff; 
    border-radius:6px; 
    font-size:15px; 
    transition: all 0.3s; 
    width: 100%; 
    box-sizing: border-box;
}
input:focus, textarea:focus, select:focus { 
    border-color:#1a73e8; 
    box-shadow:0 0 5px rgba(26,115,232,0.3); 
    outline:none; 
}
.invalid { border-color:red; }
small.error { 
    color:red; 
    font-size:13px; 
    position:absolute; 
    bottom:-18px; 
    left:0; 
}

#skills {
    padding: 10px;
    border: 2px solid #dcd6ff;
    border-radius: 6px;
    transition: 0.3s;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px;
}
#skills.highlight { 
    border-color:#1a73e8; 
    background:#e8f0fe; 
}
#skills label { 
    display: flex; 
    align-items: center; 
    gap: 6px; 
    font-weight: 400; 
    cursor: pointer; 
}

#relocateCities { display:none; }

#githubPreview, #resumePreview { margin-top:6px; font-size:14px; color:#555; }
#confirmation { display:none; text-align:center; font-size:18px; color:green; margin-top:20px; }

button { 
    background:#1a73e8; 
    color:white; 
    border:none; 
    padding:12px 25px; 
    border-radius:6px; 
    font-weight:600; 
    cursor:pointer; 
    transition:0.3s; 
}
button:hover { background:#155ab6; }

@media(max-width:768px){ 
    .container { margin:20px; padding:20px; } 
}
</style>
</head>
<body>

<header>
<h1>Tech Job Portal</h1>
</header>

<div class="container">
    <h2>Job Seeker Registration Form</h2>
    <form id="jobForm" enctype="multipart/form-data">
        <!-- Full Name -->
        <div class="form-group">
            <label>Full Name *</label>
            <input type="text" id="fullName" placeholder="Alphabets only">
            <small class="error"></small>
        </div>

        <!-- Date of Birth -->
        <div class="form-group">
            <label>Date of Birth *</label>
            <input type="date" id="dob">
            <small class="error"></small>
        </div>

        <!-- Gender -->
        <div class="form-group">
            <label>Gender *</label>
            <select id="gender">
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
                <option>Prefer not to say</option>
            </select>
            <small class="error"></small>
        </div>

        <!-- Email -->
        <div class="form-group">
            <label>Email *</label>
            <input type="text" id="email" placeholder="example@mail.com">
            <small class="error"></small>
        </div>

        <!-- Mobile -->
        <div class="form-group">
            <label>Mobile Number *</label>
            <input type="text" id="mobile" placeholder="10 digits, start with 6-9">
            <small class="error"></small>
        </div>

        <!-- Qualification -->
        <div class="form-group">
            <label>Highest Qualification *</label>
            <select id="qualification">
                <option value="">Select</option>
                <option>Bachelor's</option>
                <option>Master's</option>
                <option>PhD</option>
                <option>Diploma</option>
            </select>
            <small class="error"></small>
        </div>

        <!-- Experience -->
        <div class="form-group">
            <label>Years of Experience *</label>
            <input type="number" id="experience" min="0" max="99" placeholder="0-99">
            <small class="error"></small>
        </div>

        <!-- Skills -->
        <div class="form-group" id="skills">
            <label><input type="checkbox" name="skills" value="JavaScript"> JavaScript</label>
            <label><input type="checkbox" name="skills" value="Python"> Python</label>
            <label><input type="checkbox" name="skills" value="Java"> Java</label>
            <label><input type="checkbox" name="skills" value="C++"> C++</label>
            <label><input type="checkbox" name="skills" value="React"> React</label>
            <small class="error"></small>
        </div>

        <!-- Resume -->
        <div class="form-group">
            <label>Resume Upload (Any format, max 2MB) *</label>
            <input type="file" id="resume">
            <div id="resumePreview"></div>
            <small class="error"></small>
        </div>

        <!-- Preferred Job Location -->
        <div class="form-group">
            <label>Preferred Job Location *</label>
            <select id="location">
                <option value="">Select Location</option>
                <option>Bangalore</option>
                <option>Hyderabad</option>
                <option>Pune</option>
                <option>Chennai</option>
                <option>Delhi</option>
            </select>
            <small class="error"></small>
        </div>

        <!-- Join Date -->
        <div class="form-group">
            <label>Available to Join From *</label>
            <input type="date" id="joinDate">
            <small class="error"></small>
        </div>

        <!-- Expected Salary -->
        <div class="form-group">
            <label>Expected Salary *</label>
            <input type="text" id="salary" placeholder="Numeric only">
            <small class="error"></small>
        </div>

        <!-- GitHub/Portfolio -->
        <div class="form-group">
            <label>GitHub/Portfolio Link</label>
            <input type="url" id="github" placeholder="https://">
            <div id="githubPreview"></div>
        </div>

        <!-- Willing to Relocate -->
        <div class="form-group">
            <label>Willing to Relocate? *</label>
            <select id="relocate">
                <option value="">Select</option>
                <option value="Yes">Yes, I am willing to relocate</option>
                <option value="No">No, I prefer my current location</option>
            </select>
            <small class="error"></small>
        </div>

        <!-- Relocate Cities -->
        <div class="form-group" id="relocateCities">
            <label>Preferred Cities *</label>
            <select id="cities">
                <option value="">Select City</option>
                <option>Bangalore</option>
                <option>Hyderabad</option>
                <option>Pune</option>
                <option>Chennai</option>
                <option>Delhi</option>
            </select>
            <small class="error"></small>
        </div>

        <!-- Submit -->
        <div style="text-align:center; margin-top:20px;">
            <button type="submit">Submit</button>
        </div>
    </form>

    <div id="confirmation">Registration submitted successfully! Thank you.</div>
</div>

<footer>
Tech Job Portal &copy; 2025
</footer>

<script>
$(document).ready(function(){

    // Skills highlight
    $("#skills").hover(
        function(){ $(this).addClass("highlight"); },
        function(){ $(this).removeClass("highlight"); }
    );

    // GitHub preview
    $("#github").on("input", function(){
        let val = $(this).val();
        $("#githubPreview").text(val ? "Preview: " + val : "");
    });

    // Relocate toggle
    $("#relocate").change(function(){
        if($(this).val() === "Yes") $("#relocateCities").slideDown();
        else { $("#relocateCities").slideUp(); $("#cities").val("").removeClass("invalid").siblings(".error").text(""); }
    });

    // Resume file validation
    $("#resume").change(function(){
        const file = this.files[0];
        if(file){
            const sizeMB = file.size/1024/1024;
            if(sizeMB > 2){ 
                alert("File size must be <=2MB"); 
                $(this).val(""); 
                $("#resumePreview").text("");
                return; 
            }
            $("#resumePreview").text("Selected file: " + file.name + " (" + sizeMB.toFixed(2) + " MB)");
        }
    });

    // Full Name validation
    $("#fullName").on("input blur", function(){
        this.value = this.value.replace(/[^a-zA-Z ]/g,'');
        if(!this.value) $(this).addClass("invalid").siblings(".error").text("Required");
        else $(this).removeClass("invalid").siblings(".error").text("");
    });

    // Mobile validation
    $("#mobile").on("input", function(){
        this.value=this.value.replace(/[^0-9]/g,''); 
        if(this.value.length>10) this.value=this.value.slice(0,10);
    }).blur(function(){
        const val = $(this).val();
        if(!/^[6-9][0-9]{9}$/.test(val)){
            $(this).addClass("invalid");
            $(this).siblings(".error").text("Mobile must start with 6-9 and be 10 digits");
        } else $(this).removeClass("invalid").siblings(".error").text("");
    });

    // Experience
    $("#experience").on("input blur", function(){
        this.value = this.value.replace(/[^0-9]/g,'').slice(0,2);
        if(!this.value) $(this).addClass("invalid").siblings(".error").text("Required");
        else $(this).removeClass("invalid").siblings(".error").text("");
    });

    // Salary
    $("#salary").on("input blur", function(){
        this.value = this.value.replace(/[^0-9]/g,'');
        if(!this.value) $(this).addClass("invalid").siblings(".error").text("Required");
        else $(this).removeClass("invalid").siblings(".error").text("");
    });

    // DOB: at least 18
    const today = new Date().toISOString().split('T')[0];
    $("#dob").attr("max", today);
    $("#dob").on("change blur", function(){
        const dob = new Date(this.value);
        const age = new Date().getFullYear() - dob.getFullYear();
        if(!this.value || age < 18){
            $(this).addClass("invalid").siblings(".error").text("Must be at least 18 years old");
        } else $(this).removeClass("invalid").siblings(".error").text("");
    });

    // Email validation
    $("#email").on("input blur", function(){
        const val = $(this).val().trim();
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if(!val){
            $(this).addClass("invalid").siblings(".error").text("Required");
        } else if(!emailPattern.test(val)){
            $(this).addClass("invalid").siblings(".error").text("Enter a valid email");
        } else {
            const domainPart = val.split("@")[1] || "";
            if(/\d/.test(domainPart)){
                $(this).addClass("invalid").siblings(".error").text("Numbers not allowed after '@'");
            } else $(this).removeClass("invalid").siblings(".error").text("");
        }
    });

    // Form submit
    $("#jobForm").submit(function(e){
        e.preventDefault();
        let valid = true;

        // Required validation
        $("#jobForm input, #jobForm select").each(function(){
            if($(this).is(":visible") && !$(this).val()){
                $(this).addClass("invalid").siblings(".error").text("Required");
                valid=false;
            }
        });

        // Mobile regex check
        if(!/^[6-9][0-9]{9}$/.test($("#mobile").val())){
            $("#mobile").addClass("invalid");
            valid=false;
        }

        // Skills at least 1
        if($("#skills input:checked").length==0){ 
            $("#skills").addClass("invalid").find("small.error").text("Select at least one skill"); 
            valid=false; 
        } else { $("#skills").removeClass("invalid").find("small.error").text(""); }

        // Resume check
        if(!$("#resume").val()){ valid=false; $("#resume").addClass("invalid").siblings(".error").text("Upload resume"); }

        // Relocate cities required if visible
        if($("#relocateCities").is(":visible") && !$("#cities").val()){
            $("#cities").addClass("invalid").siblings(".error").text("Select city");
            valid=false;
        }

        // Email validation final check
        const emailVal = $("#email").val().trim();
        const domainPart = emailVal.split("@")[1] || "";
        if(!emailVal || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailVal) || /\d/.test(domainPart)){
            $("#email").addClass("invalid");
            valid=false;
        }

        if(valid){ 
            $("#jobForm").fadeOut();
            $("#confirmation").fadeIn();
        } else { alert("Please correct the highlighted fields."); }
    });

});
</script>

</body>
</html>
