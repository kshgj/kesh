<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --secondary: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-tertiary: #94a3b8;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            background: var(--bg-primary);
            border-radius: 20px;
            box-shadow: var(--shadow-xl);
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .content {
            padding: 30px;
        }

        .search-section {
            margin-bottom: 25px;
        }

        .search-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-tertiary);
            pointer-events: none;
        }

        #searchInput {
            width: 100%;
            padding: 14px 15px 14px 45px;
            font-size: 15px;
            border: 2px solid var(--border);
            border-radius: 12px;
            transition: all 0.3s ease;
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        #searchInput:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--bg-primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            flex: 1;
            min-width: 200px;
        }

        select {
            flex: 1;
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        select:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--bg-primary);
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--bg-secondary);
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid var(--primary);
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .student-list {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 10px;
            max-height: 500px;
            overflow-y: auto;
        }

        .student-list::-webkit-scrollbar {
            width: 8px;
        }

        .student-list::-webkit-scrollbar-track {
            background: var(--bg-tertiary);
            border-radius: 10px;
        }

        .student-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        .student-list::-webkit-scrollbar-thumb:hover {
            background: var(--secondary);
        }

        .student-item {
            background: var(--bg-primary);
            padding: 18px;
            margin-bottom: 8px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .student-item:hover {
            border-color: var(--primary);
            transform: translateX(5px);
            box-shadow: var(--shadow-md);
        }

        .student-info {
            flex: 1;
        }

        .student-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 5px;
        }

        .student-details {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .detail-item {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-active {
            background: #dcfce7;
            color: #166534;
        }

        .badge-inactive {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .highlight {
            background: linear-gradient(120deg, #ffd700 0%, #ffed4e 100%);
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            display: none;
        }

        .empty-state.active {
            display: block;
        }

        .empty-state-icon {
            font-size: 64px;
            opacity: 0.3;
            margin-bottom: 15px;
        }

        .empty-state-text {
            color: var(--text-secondary);
            font-size: 16px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        .modal.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: var(--bg-primary);
            border-radius: 16px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 0;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid var(--border);
        }

        .info-label {
            font-weight: 600;
            color: var(--text-secondary);
        }

        .info-value {
            color: var(--text-primary);
            text-align: right;
        }

        @media (max-width: 768px) {
            .content {
                padding: 20px;
            }

            .filters {
                flex-direction: column;
            }

            .filter-group {
                width: 100%;
                min-width: 100%;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .student-details {
                flex-direction: column;
                gap: 8px;
            }
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid var(--border);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>🎓 Student Management System</h1>
            <p>Made the work easier</p>
        </div>

        <div class="content">
            <div class="search-section">
                <div class="search-wrapper">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="Search by name, email, or ID...">
                </div>

                <div class="filters">
                    <div class="filter-group">
                        <select id="departmentFilter">
                            <option value="">All Departments</option>
                            <option value="Computer Science">Computer Science</option>
                            <option value="Engineering">Engineering</option>
                            <option value="Business">Business</option>
                            <option value="Arts">Arts</option>
                        </select>

                        <select id="statusFilter">
                            <option value="">All Status</option>
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                            <option value="Pending">Pending</option>
                        </select>
                    </div>

                    <button class="btn btn-secondary" id="resetBtn">Reset Filters</button>
                    <button class="btn btn-primary" id="exportBtn">📥 Export</button>
                </div>
            </div>

            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value" id="totalStudents">0</div>
                    <div class="stat-label">Total Students</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="activeStudents">0</div>
                    <div class="stat-label">Active</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="visibleStudents">0</div>
                    <div class="stat-label">Showing</div>
                </div>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
            </div>

            <div class="student-list" id="studentList"></div>

            <div class="empty-state" id="emptyState">
                <div class="empty-state-icon">🔍</div>
                <div class="empty-state-text">No students found matching your criteria</div>
            </div>
        </div>
    </div>

    <div class="modal" id="studentModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Student Details</h2>
                <button class="close-btn" id="closeModal">×</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function() {
            // Student data structure with more realistic information
            const students = [
                { id: 'STU001', name: 'John Doe', email: 'john.doe@university.edu', department: 'Computer Science', year: 3, gpa: 3.8, status: 'Active', phone: '+1 (555) 123-4567' },
                { id: 'STU002', name: 'Jane Smith', email: 'jane.smith@university.edu', department: 'Engineering', year: 2, gpa: 3.9, status: 'Active', phone: '+1 (555) 234-5678' },
                { id: 'STU003', name: 'Michael Johnson', email: 'michael.j@university.edu', department: 'Business', year: 4, gpa: 3.6, status: 'Active', phone: '+1 (555) 345-6789' },
                { id: 'STU004', name: 'Emily Davis', email: 'emily.davis@university.edu', department: 'Arts', year: 1, gpa: 3.7, status: 'Pending', phone: '+1 (555) 456-7890' },
                { id: 'STU005', name: 'Christopher Brown', email: 'chris.brown@university.edu', department: 'Computer Science', year: 3, gpa: 3.5, status: 'Active', phone: '+1 (555) 567-8901' },
                { id: 'STU006', name: 'Sarah Wilson', email: 'sarah.wilson@university.edu', department: 'Engineering', year: 2, gpa: 3.9, status: 'Active', phone: '+1 (555) 678-9012' },
                { id: 'STU007', name: 'Daniel Martinez', email: 'daniel.m@university.edu', department: 'Business', year: 4, gpa: 3.4, status: 'Inactive', phone: '+1 (555) 789-0123' },
                { id: 'STU008', name: 'Olivia Taylor', email: 'olivia.taylor@university.edu', department: 'Arts', year: 1, gpa: 3.8, status: 'Active', phone: '+1 (555) 890-1234' },
                { id: 'STU009', name: 'James Anderson', email: 'james.anderson@university.edu', department: 'Computer Science', year: 3, gpa: 3.7, status: 'Active', phone: '+1 (555) 901-2345' },
                { id: 'STU010', name: 'Emma Thomas', email: 'emma.thomas@university.edu', department: 'Engineering', year: 2, gpa: 3.6, status: 'Pending', phone: '+1 (555) 012-3456' },
                { id: 'STU011', name: 'Robert Garcia', email: 'robert.garcia@university.edu', department: 'Business', year: 4, gpa: 3.5, status: 'Active', phone: '+1 (555) 123-4568' },
                { id: 'STU012', name: 'Sophia Martinez', email: 'sophia.m@university.edu', department: 'Arts', year: 1, gpa: 3.9, status: 'Active', phone: '+1 (555) 234-5679' }
            ];

            let filteredStudents = [...students];

            // Debounce function for performance optimization
            function debounce(func, wait) {
                let timeout;
                return function executedFunction(...args) {
                    const later = () => {
                        clearTimeout(timeout);
                        func(...args);
                    };
                    clearTimeout(timeout);
                    timeout = setTimeout(later, wait);
                };
            }

            // Render students
            function renderStudents(studentsToRender, searchTerm = '') {
                const $list = $('#studentList');
                const $emptyState = $('#emptyState');
                
                $list.empty();

                if (studentsToRender.length === 0) {
                    $emptyState.addClass('active');
                    return;
                }

                $emptyState.removeClass('active');

                studentsToRender.forEach(student => {
                    const statusClass = student.status === 'Active' ? 'badge-active' : 
                                       student.status === 'Inactive' ? 'badge-inactive' : 'badge-pending';
                    
                    let displayName = student.name;
                    if (searchTerm) {
                        const regex = new RegExp(`(${searchTerm})`, 'gi');
                        displayName = student.name.replace(regex, '<span class="highlight">$1</span>');
                    }

                    const $item = $(`
                        <div class="student-item" data-id="${student.id}">
                            <div class="student-info">
                                <div class="student-name">${displayName}</div>
                                <div class="student-details">
                                    <span class="detail-item">📧 ${student.email}</span>
                                    <span class="detail-item">🎓 ${student.department}</span>
                                    <span class="detail-item">📊 Year ${student.year}</span>
                                    <span class="detail-item">⭐ GPA ${student.gpa}</span>
                                </div>
                            </div>
                            <span class="badge ${statusClass}">${student.status}</span>
                        </div>
                    `);

                    $item.on('click', () => showStudentDetails(student));
                    $list.append($item);
                });

                updateStats(studentsToRender.length);
            }

            // Update statistics
            function updateStats(visible) {
                const activeCount = students.filter(s => s.status === 'Active').length;
                $('#totalStudents').text(students.length);
                $('#activeStudents').text(activeCount);
                $('#visibleStudents').text(visible);
            }

            // Filter students
            function filterStudents() {
                const searchTerm = $('#searchInput').val().toLowerCase().trim();
                const department = $('#departmentFilter').val();
                const status = $('#statusFilter').val();

                filteredStudents = students.filter(student => {
                    const matchesSearch = searchTerm === '' || 
                        student.name.toLowerCase().includes(searchTerm) ||
                        student.email.toLowerCase().includes(searchTerm) ||
                        student.id.toLowerCase().includes(searchTerm);
                    
                    const matchesDepartment = department === '' || student.department === department;
                    const matchesStatus = status === '' || student.status === status;

                    return matchesSearch && matchesDepartment && matchesStatus;
                });

                renderStudents(filteredStudents, searchTerm);
            }

            // Show student details modal
            function showStudentDetails(student) {
                const $modal = $('#studentModal');
                const $modalBody = $('#modalBody');

                $modalBody.html(`
                    <div class="info-row">
                        <span class="info-label">Student ID</span>
                        <span class="info-value">${student.id}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Full Name</span>
                        <span class="info-value">${student.name}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Email</span>
                        <span class="info-value">${student.email}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Phone</span>
                        <span class="info-value">${student.phone}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Department</span>
                        <span class="info-value">${student.department}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Academic Year</span>
                        <span class="info-value">Year ${student.year}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">GPA</span>
                        <span class="info-value">${student.gpa.toFixed(2)}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Status</span>
                        <span class="info-value"><span class="badge ${student.status === 'Active' ? 'badge-active' : student.status === 'Inactive' ? 'badge-inactive' : 'badge-pending'}">${student.status}</span></span>
                    </div>
                `);

                $modal.addClass('active');
            }

            // Export to CSV
            function exportToCSV() {
                const headers = ['ID', 'Name', 'Email', 'Department', 'Year', 'GPA', 'Status', 'Phone'];
                const csvContent = [
                    headers.join(','),
                    ...filteredStudents.map(s => 
                        [s.id, s.name, s.email, s.department, s.year, s.gpa, s.status, s.phone].join(',')
                    )
                ].join('\n');

                const blob = new Blob([csvContent], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `students_export_${new Date().toISOString().split('T')[0]}.csv`;
                a.click();
                window.URL.revokeObjectURL(url);
            }

            // Event listeners
            $('#searchInput').on('keyup', debounce(filterStudents, 300));
            $('#departmentFilter, #statusFilter').on('change', filterStudents);
            
            $('#resetBtn').on('click', function() {
                $('#searchInput').val('');
                $('#departmentFilter').val('');
                $('#statusFilter').val('');
                filterStudents();
            });

            $('#exportBtn').on('click', exportToCSV);

            $('#closeModal').on('click', function() {
                $('#studentModal').removeClass('active');
            });

            $('#studentModal').on('click', function(e) {
                if (e.target === this) {
                    $(this).removeClass('active');
                }
            });

            // Initial render
            renderStudents(students);
        });
    </script>
</body>
</html>
