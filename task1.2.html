<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Government of India | COVID-19 Vaccination Registration</title>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Material Icons -->
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

<style>
/* ---------- GLOBAL STYLES ---------- */
body {margin:0;padding:0;background:#eef3f8;font-family:'Inter',sans-serif;}
.header {background:#003d7a;padding:18px 40px;display:flex;align-items:center;gap:18px;color:white;box-shadow:rgba(0,0,0,0.18) 0px 4px 12px;}
.header img {height:62px;}
.header-title {display:flex;flex-direction:column;line-height:1.3;}
.header-title h1 {margin:0;font-size:26px;font-weight:600;}
.header-title span {font-size:15px;opacity:0.9;}

.container {max-width:1000px;margin:40px auto;background:white;padding:40px;border-radius:18px;
    box-shadow:rgba(0,0,0,0.07) 0px 4px 20px;animation:fadeIn 0.5s ease;}
@keyframes fadeIn {from {opacity:0;transform:translateY(10px);} to {opacity:1;transform:translateY(0);} }

h2 {text-align:center;color:#003d7a;font-size:26px;font-weight:700;margin-bottom:28px;}
.section-title {margin:20px 0 10px;padding-bottom:6px;font-weight:600;font-size:17px;
    border-bottom:2px solid #003d7a33;color:#003d7a;}

.form-group {margin-bottom:18px;}
label {font-weight:550;display:block;margin-bottom:6px;font-size:15px;}

/* Make all input and select fields same width */
input, select {
    padding: 14px;
    width: 100%;
    box-sizing: border-box;
    border: 1px solid #d4ddeb;
    border-radius: 10px;
    font-size: 15px;
    transition: 0.23s ease;
    background: #f8fbff;
}

input:focus, select:focus {outline:none;border-color:#006dd1;background:#ffffff;
    box-shadow:0 0 0 4px rgba(0,109,209,0.15);}
.highlight {background:#fff7cc !important;}
.error {color:#d93025;font-size:13px;margin-top:4px;display:block;}
#hints {background:#eaf4ff;padding:12px;margin-bottom:20px;border-left:4px solid #006dd1;border-radius:6px;
    display:none;font-size:14%;}

/* ---------- TWO COLUMN LAYOUT ---------- */
.form-grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:24px 40px;
}
.full-width { grid-column: span 2; }

@media(max-width:768px){
    .form-grid { grid-template-columns:1fr; }
    .full-width { grid-column:span 1; }
}

/* Symptoms buttons */
#symptoms-container {display:flex;gap:10px;margin-top:6px;}
.symptom-btn {padding:8px 16px;border:1px solid #d4ddeb;border-radius:20px;cursor:pointer;
    transition:0.2s ease;}
.symptom-btn:hover {border-color:#006dd1;}
.symptom-btn.selected {background:#006dd1;color:white;border-color:#006dd1;}

/* Comorbidity pills */
#comorb-box {display:none;background:#f0f6ff;padding:15px;border-radius:10px;margin-top:10px;}
.comorb-btn {display:inline-block;padding:8px 16px;margin:5px 6px 0 0;border:1px solid #d4ddeb;
    border-radius:20px;cursor:pointer;transition:0.2s;font-size:14px;}
.comorb-btn:hover {border-color:#006dd1;}
.comorb-btn.selected {background:#006dd1;color:white;border-color:#006dd1;}

button {background:#006dd1;color:white;padding:16px 20px;font-size:17px;border:none;border-radius:12px;
    cursor:pointer;width:100%;font-weight:600;margin-top:10px;transition:.25s;}
button:hover {background:#0055a7;box-shadow:rgba(0,0,0,0.18) 0px 4px 10px;}

/* Toast notification */
#toast {
    visibility: hidden;
    min-width: 250px;
    background: #006dd1;
    color: white;
    text-align: center;
    border-radius: 8px;
    padding: 16px;
    position: fixed;
    z-index: 1000;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%);
    font-size: 16px;
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Emblem_of_India_%28gold%29.svg/1200px-Emblem_of_India_%28gold%29.svg.png">
<div class="header-title">
<h1>Government of India</h1>
<span>Ministry of Health & Family Welfare</span>
</div>
</div>

<!-- CONTAINER -->
<div class="container">

<h2>COVID-19 Vaccination Registration</h2>
<div id=""></div>

<form id="vaccineForm">

<div class="form-grid">

<!-- PERSONAL INFO -->
<div class="section-title full-width">Personal Information</div>

<div class="form-group">
<label>Full Name</label>
<input type="text" id="fullName" class="field" data-hint="Enter your legal full name.">
<span class="error" id="fullNameErr"></span>
</div>

<div class="form-group">
<label>Age</label>
<input type="number" id="age" class="field" data-hint="Must be 18+ to register.">
<span class="error" id="ageErr"></span>
</div>

<div class="form-group">
<label>Gender</label>
<select id="gender" class="field" data-hint="Select gender.">
<option value="">Select</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>
<span class="error" id="genderErr"></span>
</div>

<div class="form-group">
<label>Aadhaar Number</label>
<input type="text" id="aadhaar" class="field" data-hint="Enter 12-digit Aadhaar number.">
<span class="error" id="aadhaarErr"></span>
</div>

<!-- CONTACT -->
<div class="form-group">
<label>Mobile Number</label>
<input type="text" id="mobile" class="field" data-hint="Enter valid 10-digit mobile number.">
<span class="error" id="mobileErr"></span>
</div>

<div class="form-group">
<label>Email</label>
<input type="text" id="email" class="field" data-hint="Enter email address. No numbers allowed after @.">
<span class="error" id="emailErr"></span>
</div>

<div class="form-group full-width">
<label>Address</label>
<input type="text" id="address" class="field" data-hint="Enter residential address.">
<span class="error" id="addressErr"></span>
</div>

<!-- LOCATION -->
<div class="section-title full-width">Location</div>

<div class="form-group">
<label>State</label>
<select id="state" class="field" data-hint="Select your state.">
<option value="">Select</option>
<option>Maharashtra</option>
<option>Karnataka</option>
<option>Delhi</option>
<option>Tamil Nadu</option>
<option>Uttar Pradesh</option>
</select>
<span class="error" id="stateErr"></span>
</div>

<div class="form-group">
<label>District</label>
<select id="district" class="field" data-hint="Select district.">
<option value="">Select</option>
</select>
<span class="error" id="districtErr"></span>
</div>

<!-- VACCINATION INFO -->
<div class="section-title full-width">Vaccination Details</div>

<div class="form-group">
<label>Vaccination Dose</label>
<select id="dose" class="field" data-hint="Select dose.">
<option value="">Select</option>
<option value="1st">1st Dose</option>
<option value="2nd">2nd Dose</option>
<option value="Booster">Booster</option>
</select>
<span class="error" id="doseErr"></span>
</div>

<div class="form-group">
<label>Vaccination Center</label>
<select id="center" class="field">
<option value="">Select Center</option>
</select>
<span class="error" id="centerErr"></span>
</div>

<div class="form-group full-width">
<label>Date of Appointment</label>
<input type="date" id="date" class="field" data-hint="Choose appointment date.">
<span class="error" id="dateErr"></span>
</div>

<!-- HEALTH -->
<div class="section-title full-width">Health Information</div>

<div class="form-group">
<label>Symptoms in last 14 days?</label>
<div id="symptoms-container"></div>
<span class="error" id="symptomsErr"></span>
</div>

<div class="form-group full-width" id="comorb-box">
<label>Co-morbidities</label><br>
<div id="comorb-container">
<div class="comorb-btn" data-value="Diabetes">Diabetes</div>
<div class="comorb-btn" data-value="Hypertension">Hypertension</div>
<div class="comorb-btn" data-value="Asthma">Asthma</div>
<div class="comorb-btn" data-value="Heart Disease">Heart Disease</div>
</div>
<span class="error" id="comorbErr"></span>
</div>

<div class="full-width">
<button type="submit">Submit Registration</button>
</div>

</div> <!-- grid end -->

</form>
</div>

<!-- Toast -->
<div id="toast">Registration Successful!</div>

<script>
$(document).ready(function(){

// ---------- FIELD HINT ----------
$(".field").mouseenter(function(){ $(this).addClass("highlight"); })
             .mouseleave(function(){ $(this).removeClass("highlight"); })
             .mousemove(function(){ $("#hints").show().text($(this).data("hint")); });

// ---------- STATE → DISTRICT ----------
const statesDistricts = {
    "Maharashtra":["Mumbai","Pune","Nagpur","Nashik"],
    "Karnataka":["Bengaluru","Mysore","Mangalore","Hubli"],
    "Delhi":["Central Delhi","South Delhi","North Delhi"],
    "Tamil Nadu":["Chennai","Coimbatore","Madurai","Salem"],
    "Uttar Pradesh":["Lucknow","Kanpur","Varanasi","Agra"]
};

$("#state").change(function(){
    $("#district").html('<option value="">Select</option>');
    if(statesDistricts[this.value]){
        statesDistricts[this.value].forEach(d=>$("#district").append(`<option>${d}</option>`));
    }
});

// ---------- SYMPTOMS ----------
$("#symptoms-container").html(["Yes","No"].map(v=>`<div class="symptom-btn" data-value="${v}">${v}</div>`));

$(document).on("click", ".symptom-btn", function(){
    $(".symptom-btn").removeClass("selected");
    $(this).addClass("selected");
    $("#symptomsErr").text("");

    if($(this).data("value")==="Yes") $("#comorb-box").slideDown();
    else $("#comorb-box").slideUp();
});

// ---------- COMORBIDITY ----------
$(document).on("click", ".comorb-btn", function(){
    $(this).toggleClass("selected");
    if($("#comorb-container .comorb-btn.selected").length>0){
        $("#comorbErr").text("");
    }
});

// ---------- DOSE → CENTER ----------
const centers = {
    "1st":["City Hospital","Community Hall A","Govt Clinic 4"],
    "2nd":["Mega Vaccination Center","City Hospital"],
    "Booster":["Special Booster Camp","Govt Clinic 4"]
};

$("#dose").change(function(){
    $("#center").html('<option value="">Select Center</option>');
    if(centers[this.value]){
        centers[this.value].forEach(c=>$("#center").append(`<option>${c}</option>`));
    }
});

// ---------- DATE CONSTRAINT ----------
const today = new Date().toISOString().split('T')[0];
$("#date").attr("min", today);

// ---------- LIVE VALIDATION MAIN RULES ----------
const rules = {
    fullName: v => /^[A-Za-z\s]{3,}$/.test(v),
    age: v => v >= 18 && v <= 120,
    gender: v => v !== "",
    aadhaar: v => /^\d{12}$/.test(v),
    mobile: v => /^[6-9]\d{9}$/.test(v),
    // Email: no numbers after @
    email: v => {
        let general = /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v);
        if(!general) return false;
        let domainPart = v.split("@")[1] || "";
        return !/\d/.test(domainPart);
    },
    address: v => v.length >= 5,
    state: v => v !== "",
    district: v => v !== "",
    dose: v => v !== "",
    center: v => v !== "",
    date: v => v !== "" && v >= today
};

const messages = {
    fullName: "Enter valid name (letters only, min 3 chars).",
    age: "Age must be 18-120.",
    gender: "Select gender.",
    aadhaar: "Aadhaar must be 12 digits.",
    mobile: "Invalid mobile number.",
    email: "Invalid email format (no numbers allowed after @).",
    address: "Enter a proper address.",
    state: "Select state.",
    district: "Select district.",
    dose: "Select dose.",
    center: "Select center.",
    date: "Select valid date."
};

// Apply live validation
$(".field, #center").on("input change", function(){
    let id = $(this).attr("id");
    let value = $(this).val().trim();
    if(rules[id]){
        if(!rules[id](value)) $("#" + id + "Err").text(messages[id]);
        else $("#" + id + "Err").text("");
    }
});

// ---------- FINAL SUBMIT ----------
$("#vaccineForm").submit(function(e){
    e.preventDefault(); // prevent default form submit
    let valid = true;

    $(".field, #center").each(function(){
        let id = $(this).attr("id");
        let value = $(this).val().trim();
        if(rules[id] && !rules[id](value)){
            $("#" + id + "Err").text(messages[id]);
            valid = false;
        }
    });

    let symptoms = $(".symptom-btn.selected").data("value");
    if(!symptoms){
        $("#symptomsErr").text("Select an option.");
        valid = false;
    }

    if(symptoms==="Yes" && $("#comorb-container .comorb-btn.selected").length===0){
        $("#comorbErr").text("Select at least one co-morbidity.");
        valid = false;
    }

    if(valid){
        // Show toast
        let toast = $("#toast");
        toast.css("visibility","visible");
        setTimeout(()=>{ toast.css("visibility","hidden"); }, 3000);

        // Reset form
        $("#vaccineForm")[0].reset();
        $(".symptom-btn, .comorb-btn").removeClass("selected");
        $("#comorb-box").hide();
    }
});
});
</script>

</body>
</html>
