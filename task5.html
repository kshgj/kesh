<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College ERP - UG Admission Form</title>

<!-- Google Fonts & Font Awesome -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
* { box-sizing: border-box; margin:0; padding:0; }

body { font-family:'Roboto', sans-serif; background: linear-gradient(to right, #74ebd5, #ACB6E5); color:#333; }
header, footer { text-align:center; padding:20px 0; background:#2c3e50; color:white; font-weight:500; }
.container { max-width: 700px; margin:40px auto; background:#fff; padding:40px; border-radius:15px; box-shadow:0 10px 25px rgba(0,0,0,0.15); }
h2 { text-align:center; color:#2980b9; margin-bottom:25px; }

/* Form input styles */
.form-group { position:relative; margin-bottom:25px; width:100%; }
.form-group input, .form-group select, .form-group textarea, .form-group input[type="file"] {
    width:100%;
    max-width:100%;
    padding:12px 40px 12px 35px;
    border:2px solid #dcd6ff;
    border-radius:8px;
    font-size:15px;
    transition: all 0.3s;
}
.form-group label {
    position:absolute; top:12px; left:35px; color:#999;
    pointer-events:none; transition: all 0.3s; background:white; padding:0 5px;
}
.form-group input:focus + label, 
.form-group input:not(:placeholder-shown) + label,
.form-group select:focus + label,
.form-group select:not([value=""]) + label,
.form-group input[type="file"]:focus + label,
.form-group input[type="file"]:not([value=""]) + label {
    top:-10px; left:30px; color:#2980b9; font-size:13px; font-weight:500;
}

/* Input icons */
.input-icon { position:relative; }
.input-icon i { position:absolute; top:50%; left:10px; transform:translateY(-50%); color:#999; }
.input-icon input, .input-icon select, .input-icon input[type="file"] { padding-left:35px; }

/* Validation styles */
input.invalid, select.invalid { border-color:red; }
input.valid, select.valid { border-color:green; }

/* Button */
button { background:#2980b9; color:white; border:none; padding:12px 30px; border-radius:8px; font-weight:600; cursor:pointer; transition:0.3s; font-size:16px; }
button:disabled { background:#ccc; cursor:not-allowed; }
button:hover:not(:disabled) { background:#1c5980; }

/* Hostel options cards (Google-style floating label) */
.hostel-group {
    position: relative;
    margin-bottom: 25px;
    padding-top: 25px; /* extra space to prevent merging with label */
}
.hostel-group .floating-label {
    position: absolute;
    top: 0px; /* label at the top of group */
    left: 10px;
    font-size: 14px;
    color: #2980b9;
    font-weight: 500;
    background: #fff;
    padding: 0 5px;
    z-index: 1;
}

.hostel-options {
    display:flex;
    gap:15px;
    flex-wrap: wrap;
    margin-top:10px;
}
.hostel-card {
    flex:1 1 48%;
    min-width:120px;
    max-width:48%;
    padding:12px;
    text-align:center;
    border:2px solid #dcd6ff;
    border-radius:8px;
    cursor:pointer;
    transition:all 0.3s;
    background:#fff;
    position: relative;
}
.hostel-card:hover { box-shadow:0 4px 10px rgba(0,0,0,0.1); }
.hostel-card.selected { border-color:#4285f4; background:#e8f0fe; color:#4285f4; font-weight:600; }
.hostel-card.selected::after { content: '\f00c'; font-family: "Font Awesome 6 Free"; font-weight:900; position:absolute; top:8px; right:10px; color:#4285f4; font-size:16px; }

/* Gender as input box with icon */
.gender-input {
    position:relative;
}
.gender-input select {
    width:100%;
    padding:12px 40px 12px 35px;
    border:2px solid #dcd6ff;
    border-radius:8px;
    font-size:15px;
    transition: all 0.3s;
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    background:url('data:image/svg+xml;utf8,<svg fill="%23999" height="16" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>') no-repeat right 10px center;
    background-size: 16px;
}
.gender-input label {
    position:absolute; top:12px; left:35px; color:#999;
    pointer-events:none; transition: all 0.3s; background:white; padding:0 5px;
}
.gender-input select:focus + label,
.gender-input select:not([value=""]) + label {
    top:-10px; left:30px; color:#2980b9; font-size:13px; font-weight:500;
}

/* Responsive */
@media(max-width:500px) {
    .hostel-card { flex:1 1 100%; max-width:100%; }
    .input-icon i { left:8px; }
    .form-group input, .form-group select, .form-group input[type="file"] { padding-left:30px; }
}
</style>
</head>
<body>

<header>
<h1>College ERP - UG Admission</h1>
</header>

<div class="container">
<h2>UG Admission Form</h2>
<form id="admissionForm" enctype="multipart/form-data" novalidate>

<!-- Student Name -->
<div class="form-group input-icon">
    <input type="text" id="studentName" placeholder=" " required>
    <label>Student Full Name *</label>
    <i class="fa fa-user"></i>
</div>

<!-- Date of Birth -->
<div class="form-group input-icon">
    <input type="date" id="dob" placeholder=" " required>
    <label>Date of Birth *</label>
    <i class="fa fa-calendar"></i>
</div>

<!-- Gender Section -->
<div class="form-group gender-input input-icon">
    <select name="gender" id="gender" required>
        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
    </select>
    <label>Gender *</label>
    <i class="fa fa-venus-mars"></i>
</div>

<!-- Department -->
<div class="form-group input-icon">
    <select id="department" required>
        <option value="">Select Department</option>
        <option value="Arts">Arts</option>
        <option value="Science">Science</option>
        <option value="Commerce">Commerce</option>
    </select>
    <label>Department *</label>
    <i class="fa fa-building"></i>
</div>

<!-- Course Type -->
<div class="form-group input-icon">
    <select id="courseType" required>
        <option value="">Select Course</option>
        <option value="B.A">B.A</option>
        <option value="B.Sc">B.Sc</option>
        <option value="B.Com">B.Com</option>
    </select>
    <label>Course Type *</label>
    <i class="fa fa-book"></i>
</div>

<!-- Marks -->
<div class="form-group input-icon">
    <input type="number" id="tenthMark" placeholder=" " min="0" max="100" required>
    <label>10th Mark Percentage *</label>
    <i class="fa fa-percent"></i>
</div>
<div class="form-group input-icon">
    <input type="number" id="twelfthMark" placeholder=" " min="0" max="100" required>
    <label>12th Mark Percentage *</label>
    <i class="fa fa-percent"></i>
</div>
<div class="form-group input-icon">
    <select id="board" required>
        <option value="">Select Board</option>
        <option>CBSE</option>
        <option>ICSE</option>
        <option>State Board</option>
    </select>
    <label>Board of Study *</label>
    <i class="fa fa-graduation-cap"></i>
</div>

<!-- Contact -->
<div class="form-group input-icon">
    <input type="text" id="mobile" placeholder=" " required>
    <label>Mobile Number *</label>
    <i class="fa fa-phone"></i>
</div>
<div class="form-group input-icon">
    <input type="email" id="email" placeholder=" " required>
    <label>Email ID *</label>
    <i class="fa fa-envelope"></i>
</div>

<!-- Parents -->
<div class="form-group input-icon">
    <input type="text" id="fatherName" placeholder=" " required>
    <label>Father’s Name *</label>
    <i class="fa fa-user"></i>
</div>
<div class="form-group input-icon">
    <input type="text" id="motherName" placeholder=" " required>
    <label>Mother’s Name *</label>
    <i class="fa fa-user"></i>
</div>

<!-- Hostel -->
<div class="form-group hostel-group">
    <label class="floating-label">Room Accommodation Needed? *</label>
    <div class="hostel-options">
        <div class="hostel-card" data-value="Yes">Yes</div>
        <div class="hostel-card" data-value="No">No</div>
    </div>
</div>

<!-- Room Preference -->
<div class="form-group input-icon" id="roomPreference" style="display:none;">
    <select id="roomType">
        <option value="">Select Room Type</option>
        <option>Single</option>
        <option>Double</option>
        <option>Triple</option>
    </select>
    <label>Room Preference</label>
</div>

<!-- Photo Upload -->
<div class="form-group input-icon">
    <input type="file" id="photo" accept="image/*" required>
    <label>Upload Passport Size Photo *</label>
    <i class="fa fa-image"></i>
</div>

<div style="text-align:center; margin-top:25px;">
    <button type="submit" id="submitBtn" disabled>Submit</button>
</div>
</form>
</div>

<footer>
College ERP &copy; 2025
</footer>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
$(document).ready(function(){

    // Hostel card selection
    $(".hostel-card").click(function(){
        $(".hostel-card").removeClass("selected");
        $(this).addClass("selected");
        if($(this).data("value")=="Yes") $("#roomPreference").slideDown();
        else $("#roomPreference").slideUp();
        toggleSubmit();
    });

    // Validation functions
    function validateText(id){ 
        const val=$("#"+id).val().trim();
        const regex=/^[A-Za-z\s]+$/;
        if(!regex.test(val)) { $("#"+id).addClass("invalid").removeClass("valid"); return false; }
        else { $("#"+id).removeClass("invalid").addClass("valid"); return true; }
    }
    function validateEmail(){ 
        const val=$("#email").val().trim(); 
        const regex=/^\S+@\S+\.\S+$/; 
        return regex.test(val) ? ($("#email").removeClass("invalid").addClass("valid"), true) : ($("#email").addClass("invalid").removeClass("valid"), false);
    }
    function validateMobile(){ 
        const val=$("#mobile").val().trim(); 
        return /^\d{10}$/.test(val) ? ($("#mobile").removeClass("invalid").addClass("valid"), true) : ($("#mobile").addClass("invalid").removeClass("valid"), false);
    }
    function validateMarks(id){
        const val=parseFloat($("#"+id).val());
        if(isNaN(val) || val<40 || val>100){ $("#"+id).addClass("invalid").removeClass("valid"); return false; }
        else { $("#"+id).removeClass("invalid").addClass("valid"); return true; }
    }

    $("#studentName, #fatherName, #motherName").blur(function(){ validateText(this.id); toggleSubmit(); });
    $("#email").blur(function(){ validateEmail(); toggleSubmit(); });
    $("#mobile").blur(function(){ validateMobile(); toggleSubmit(); });
    $("#tenthMark, #twelfthMark").blur(function(){ validateMarks(this.id); toggleSubmit(); });

    // Enable submit button if all required fields are valid
    function toggleSubmit(){
        let valid=true;
        $("#admissionForm [required]").each(function(){
            if($(this).hasClass("invalid") || !$(this).val()) valid=false;
        });
        if(!$("#gender").val()) valid=false;
        if(!$(".hostel-card.selected").length) valid=false;
        $("#submitBtn").prop("disabled", !valid);
    }

    $("#admissionForm").submit(function(e){
        e.preventDefault();
        alert("Form submitted successfully!");
        $(this)[0].reset();
        $("input, select").removeClass("valid invalid");
        $("#roomPreference").hide();
        $(".hostel-card").removeClass("selected");
        $("#submitBtn").prop("disabled", true);
    });
});
</script>
</body>
</html>
