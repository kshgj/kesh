<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faculty Onboarding Form - College Portal</title>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<!-- SweetAlert -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
body {
    font-family: 'Roboto', sans-serif;
    background: #f8f9fa;
    margin: 0;
    color: #202124;
}

header, footer {
    text-align: center;
    padding: 20px 0;
    background: #1a73e8;
    color: white;
    font-weight: 500;
}

.container {
    max-width: 900px;
    margin: 30px auto;
    background: #fff;
    padding: 40px 30px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}

h2 {
    text-align: center;
    color: #1a73e8;
    margin-bottom: 30px;
}

.form-group {
    margin-bottom: 20px;
    position: relative;
}

label {
    display: block;
    font-weight: 500;
    margin-bottom: 6px;
}

input, select, textarea {
    width: 100%;
    padding: 12px 15px;
    border: 1px solid #dadce0;
    border-radius: 8px;
    font-size: 15px;
    transition: all 0.3s;
}

input:focus, select:focus, textarea:focus {
    border-color: #1a73e8;
    box-shadow: 0 1px 6px rgba(26,115,232,0.3);
    outline: none;
}

input.invalid, select.invalid {
    border-color: red;
}

small.error {
    color: red;
    font-size: 12px;
    display: block;
    margin-top: 4px;
}

button {
    background: #1a73e8;
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
    margin-right: 10px;
}

button:hover {
    background: #155ab6;
}

#laptopConfig, #phdDetails {
    display: none;
    margin-top: 10px;
    padding: 15px;
    border: 1px solid #dadce0;
    border-radius: 8px;
    background: #f1f3f4;
}

#idPreview {
    margin-top: 10px;
    max-height: 150px;
    display: none;
    border-radius: 6px;
}

#qualificationSection:hover {
    background-color: #e8f0fe;
    border-radius: 8px;
    padding: 10px;
}

/* Google-style radio buttons */
.radio-group {
    display: flex;
    gap: 30px;
    align-items: center;
    margin-top: 5px;
}

.radio-group label {
    display: flex;
    align-items: center;
    cursor: pointer;
    font-weight: 500;
}

.radio-group input[type="radio"] {
    margin-right: 8px;
    accent-color: #1a73e8; /* Google blue */
    width: 18px;
    height: 18px;
}

@media(max-width:768px){
    .container { margin: 20px; padding: 20px; }
    .radio-group { flex-direction: column; align-items: flex-start; gap: 10px; }
}
</style>
</head>
<body>

<header>
    <h1>College Portal</Portal> - Faculty Onboarding</h1>
</header>

<div class="container">
<h2>Faculty Onboarding Form</h2>
<form id="facultyForm" enctype="multipart/form-data">

    <!-- Full Name -->
    <div class="form-group">
        <label>Full Name *</label>
        <input type="text" id="fullName" required placeholder="Enter full name">
        <small class="error"></small>
    </div>

    <!-- Gender -->
    <div class="form-group">
        <label>Gender *</label>
        <select id="gender" required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>
        <small class="error"></small>
    </div>

    <!-- Date of Birth & Age -->
    <div class="form-group">
        <label>Date of Birth *</label>
        <input type="date" id="dob" required>
        <small class="error"></small>
    </div>
    <div class="form-group">
        <label>Age</label>
        <input type="text" id="age" readonly placeholder="Age will be calculated">
    </div>

    <!-- Qualification -->
    <div class="form-group" id="qualificationSection">
        <label>Qualification *</label>
        <select id="qualification" required>
            <option value="">Select Qualification</option>
            <option value="Ph.D">Ph.D</option>
            <option value="M.Phil">M.Phil</option>
            <option value="PG">PG</option>
        </select>
        <small class="error"></small>
    </div>

    <!-- PhD Details -->
    <div class="form-group" id="phdDetails">
        <label>Ph.D Thesis Title</label>
        <input type="text" id="thesisTitle" placeholder="Enter thesis title">
    </div>

    <!-- Experience -->
    <div class="form-group">
        <label>Experience (Years) *</label>
        <input type="text" id="experience" required placeholder="0-40">
        <small class="error"></small>
    </div>

    <!-- Mobile -->
    <div class="form-group">
        <label>Mobile Number *</label>
        <input type="text" id="mobile" required placeholder="10 digits starting 6-9">
        <small class="error"></small>
    </div>

    <!-- Email -->
    <div class="form-group">
        <label>Email *</label>
        <input type="email" id="email" required placeholder="example@domain.com">
        <small class="error"></small>
    </div>

    <!-- Specialization -->
    <div class="form-group">
        <label>Specialization *</label>
        <input type="text" id="specialization" required placeholder="e.g., AI, Quantum Physics">
        <small class="error"></small>
    </div>

    <!-- Department -->
    <div class="form-group">
        <label>Department Assigned *</label>
        <select id="department" required>
            <option value="">Select Department</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Mathematics">Mathematics</option>
            <option value="Physics">Physics</option>
            <option value="Commerce">Commerce</option>
        </select>
        <small class="error"></small>
    </div>

    <!-- Course -->
    <div class="form-group">
        <label>Course Assigned *</label>
        <select id="course" required>
            <option value="">Select Course</option>
        </select>
        <small class="error"></small>
    </div>

    <!-- Joining Date -->
    <div class="form-group">
        <label>Joining Date *</label>
        <input type="date" id="joiningDate" required>
        <small class="error"></small>
    </div>

    <!-- Mode of Employment -->
    <div class="form-group">
        <label>Mode of Employment *</label>
        <select id="mode" required>
            <option value="">Select Mode</option>
            <option>Full-Time</option>
            <option>Part-Time</option>
            <option>Guest</option>
        </select>
        <small class="error"></small>
    </div>

    <!-- ID Proof Upload -->
    <div class="form-group">
        <label>Upload ID Proof *</label>
        <input type="file" id="idProof" accept=".pdf,.jpeg,.jpg,.png" required>
        <img id="idPreview" alt="Preview">
        <small class="error"></small>
    </div>

    <!-- Laptop Requirement -->
    <div class="form-group">
        <label>Need College Laptop? *</label>
        <div class="radio-group">
            <label><input type="radio" name="laptop" value="Yes" required> Yes</label>
            <label><input type="radio" name="laptop" value="No"> No</label>
        </div>
        <small class="error"></small>
    </div>

    <div id="laptopConfig">
        <label>Laptop Configuration</label>
        <select id="laptopSpecs">
            <option value="">Select Configuration</option>
            <option>Intel i5 / 8GB RAM / 256GB SSD</option>
            <option>Intel i7 / 16GB RAM / 512GB SSD</option>
            <option>AMD Ryzen 5 / 8GB RAM / 512GB SSD</option>
        </select>
    </div>

    <div style="text-align:center; margin-top:20px;">
        <button type="submit" id="submitBtn">Submit</button>
        <button type="reset">Reset</button>
    </div>
</form>
</div>

<footer>
College Portal</Portal> &copy; 2025
</footer>

<script>
$(document).ready(function(){

    function showError(input, message){
        $(input).addClass('invalid').siblings('small.error').text(message);
    }
    function clearError(input){
        $(input).removeClass('invalid').siblings('small.error').text('');
    }

    // Alphabet only: Full Name & Specialization
    $("#fullName, #specialization").on('input', function(){
        let val = $(this).val();
        if(!/^[a-zA-Z\s]*$/.test(val)){
            showError(this, 'Only alphabets and spaces allowed');
        } else {
            clearError(this);
        }
    });

    // Age calculation
    $("#dob").change(function(){
        let dob = new Date($(this).val());
        let today = new Date();
        if(dob != 'Invalid Date'){
            let age = today.getFullYear() - dob.getFullYear();
            let m = today.getMonth() - dob.getMonth();
            if(m < 0 || (m === 0 && today.getDate() < dob.getDate())) age--;
            $("#age").val(age);
            clearError(this);
        } else {
            $("#age").val('');
            showError(this, 'Invalid Date');
        }
    });

    // Experience numeric validation
    $("#experience").on('input', function(){
        this.value = this.value.replace(/[^0-9]/g,'');
        if(this.value>40) this.value=40;
        clearError(this);
    });

    // Mobile validation
    $("#mobile").on('blur input', function(){
        if(!/^[6-9]\d{9}$/.test($(this).val())) showError(this, 'Enter valid 10-digit mobile number starting with 6-9');
        else clearError(this);
    });

    // Email validation
    $("#email").on('blur input', function(){
        const emailReg = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
        if(!emailReg.test($(this).val())) showError(this, 'Enter valid email');
        else clearError(this);
    });

    // Laptop config toggle
    $("input[name='laptop']").change(function(){
        if($(this).val() == "Yes") $("#laptopConfig").slideDown();
        else $("#laptopConfig").slideUp();
    });

    // PhD details toggle
    $("#qualification").change(function(){
        if($(this).val() == "Ph.D") $("#phdDetails").slideDown();
        else $("#phdDetails").slideUp();
    });

    // ID Preview & Validation
    $("#idProof").change(function(e){
        const file = e.target.files[0];
        if(file){
            const validTypes = ['image/jpeg','image/jpg','image/png','application/pdf'];
            if(!validTypes.includes(file.type)){
                showError(this, 'Invalid file type. Use JPEG, PNG, or PDF');
                $(this).val('');
                $("#idPreview").hide();
                return;
            }
            if(file.size > 2*1024*1024){
                showError(this, 'File size must be under 2MB');
                $(this).val('');
                $("#idPreview").hide();
                return;
            }
            clearError(this);
            if(file.type.startsWith('image/')){
                $("#idPreview").attr('src', URL.createObjectURL(file)).show();
            } else {
                $("#idPreview").hide();
                Swal.fire('File Selected', file.name, 'info');
            }
        }
    });

    // Courses by department
    const courses = {
        "Computer Science": ["Data Structures","Algorithms","AI","Machine Learning"],
        "Mathematics": ["Calculus","Linear Algebra","Statistics"],
        "Physics": ["Mechanics","Quantum Physics","Thermodynamics"],
        "Commerce": ["Accounting","Finance","Economics"]
    };

    $("#department").change(function(){
        const dept = $(this).val();
        $("#course").empty().append('<option value="">Select Course</option>');
        if(courses[dept]){
            courses[dept].forEach(c => $("#course").append('<option>'+c+'</option>'));
        }
    });

    // Form Submission
    $("#facultyForm").submit(function(e){
        e.preventDefault();
        let valid = true;

        $("#facultyForm [required]").each(function(){
            if(!$(this).val()){
                showError(this, 'This field is required');
                valid = false;
            } else {
                clearError(this);
            }
        });

        if(!valid){
            Swal.fire({icon:'error',title:'Oops!',text:'Please fill all required fields correctly.',confirmButtonColor:'#d33'});
            return;
        }

        Swal.fire({
            title:'Submit Form?',
            text:'Please confirm your submission.',
            icon:'question',
            showCancelButton:true,
            confirmButtonColor:'#1a73e8',
            cancelButtonColor:'#d33',
            confirmButtonText:'Yes, submit!'
        }).then((result)=>{
            if(result.isConfirmed){
                Swal.fire({icon:'success',title:'Success!',text:'Faculty Onboarding Submitted Successfully!',confirmButtonColor:'#1a73e8'});
                $(this)[0].reset();
                $("#laptopConfig, #phdDetails, #idPreview").hide();
                $("#age").val('');
            }
        });
    });

});
</script>
</body>
</html>
