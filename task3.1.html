<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XYZ University Admission Form</title>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- Google Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
/* Global Styles */
body { font-family:'Roboto', sans-serif; background:#f5f6fa; margin:0; color:#333; }
h2,h3 { text-align:center; color:#4B2FBF; }
.container { max-width: 800px; margin: 40px auto; background:#fff; padding:30px; border-radius:12px; box-shadow:0 6px 18px rgba(0,0,0,0.1); }
header, footer { text-align:center; padding:15px 0; background:#4B2FBF; color:white; font-weight:500; border-radius:8px; margin-bottom:20px; }

/* Progress Bar */
.progress-container { display:flex; justify-content:space-between; margin-bottom:30px; }
.progress-step { width:30px; height:30px; background:#dcd6ff; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#4B2FBF; font-weight:bold; transition:0.3s; }
.progress-step.active { background:#4B2FBF; color:white; }

/* Form Steps */
.form-step { display:none; }
.step-active { display:block; }
.form-group { margin-bottom:20px; position:relative; }
label { display:block; font-weight:500; margin-bottom:6px; }
input, select, textarea { width:100%; padding:10px 12px; border:2px solid #dcd6ff; border-radius:6px; font-size:15px; transition: all 0.3s; }
input:focus, select:focus, textarea:focus { border-color:#4B2FBF; box-shadow:0 0 5px rgba(75,47,191,0.3); outline:none; }
input.invalid, select.invalid, textarea.invalid { border-color:red; }
small.error { color:red; font-size:13px; position:absolute; bottom:-18px; left:0; }
button { background:#4B2FBF; color:white; border:none; padding:12px 25px; border-radius:6px; font-weight:600; cursor:pointer; transition:0.3s; }
button:hover { background:#351fa0; }

/* Guardian Section */
#guardianSection { display:none; padding:15px; background:#f1f1f1; border-radius:8px; margin-top:10px; }

/* GPA Preview */
#gpaPreview { font-weight:bold; margin-top:10px; }

/* Tooltip */
.tooltip { position:absolute; top:50%; right:10px; transform:translateY(-50%); font-size:14px; color:#555; }

/* File Preview */
#filePreview { margin-top:10px; font-size:14px; color:#333; }

/* Confirmation */
#confirmation { display:none; text-align:center; font-size:18px; color:green; margin-top:20px; }

@media(max-width:768px){ .container { margin:20px; padding:20px; } }
</style>
</head>
<body>

<header>
<h1>XYZ University Admission Portal</h1>
</header>

<div class="container">
    <h2>Online Admission Form</h2>
    <div class="progress-container">
        <div class="progress-step active">1</div>
        <div class="progress-step">2</div>
        <div class="progress-step">3</div>
        <div class="progress-step">4</div>
    </div>

    <form id="admissionForm" enctype="multipart/form-data">
        <!-- Step 1: Personal Info -->
        <div class="form-step step-active">
            <div class="form-group">
                <label>Student Name *</label>
                <input type="text" id="studentName" required>
                <small class="error"></small>
                <span class="tooltip">Alphabets only</span>
            </div>
            <div class="form-group">
                <label>Date of Birth *</label>
                <input type="date" id="dob" required>
                <small class="error"></small>
            </div>
            <div class="form-group">
                <label>Gender *</label>
                <select id="gender" required>
                    <option value="">Select</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>
            <div class="form-group">
                <label>Father’s Name *</label>
                <input type="text" id="fatherName" required>
                <small class="error"></small>
            </div>
            <div class="form-group">
                <label>Mother’s Name *</label>
                <input type="text" id="motherName" required>
                <small class="error"></small>
            </div>
            <div class="form-btns" style="text-align:right;">
                <button type="button" class="next-btn">Next</button>
            </div>
        </div>

        <!-- Step 2: Academic Info -->
        <div class="form-step">
            <div class="form-group">
                <label>Address *</label>
                <textarea id="address" rows="3" required></textarea>
                <small class="error"></small>
            </div>
            <div class="form-group">
                <label>10th Mark % *</label>
                <input type="text" id="mark10" required placeholder="0.00">
                <small class="error"></small>
            </div>
            <div class="form-group">
                <label>12th Mark % *</label>
                <input type="text" id="mark12" required placeholder="0.00">
                <small class="error"></small>
            </div>
            <div id="gpaPreview">GPA: 0</div>
            <div class="form-group">
                <label>Course Applying For *</label>
                <select id="course" required>
                    <option value="">Select Course</option>
                    <option value="BSc">B.Sc</option>
                    <option value="BA">B.A</option>
                    <option value="BCom">B.Com</option>
                    <option value="BTech">B.Tech</option>
                    <option value="BBA">BBA</option>
                </select>
                <small class="error"></small>
            </div>
            <div class="form-group" id="electivesContainer" style="display:none;">
                <label>Electives *</label>
                <select id="electives"></select>
                <small class="error"></small>
            </div>
            <div class="form-group">
                <label>Upload Marksheet (PDF/JPG, ≤5MB) *</label>
                <input type="file" id="marksheet" accept=".pdf,.jpg,.jpeg" required>
                <div id="filePreview"></div>
            </div>
            <div class="form-btns" style="text-align:right;">
                <button type="button" class="back-btn">Back</button>
                <button type="button" class="next-btn">Next</button>
            </div>
        </div>

        <!-- Step 3: Contact Info -->
        <div class="form-step">
            <div class="form-group">
                <label>Email *</label>
                <input type="email" id="email" required>
                <small class="error"></small>
            </div>
            <div class="form-group">
                <label>Mobile *</label>
                <input type="text" id="mobile" required placeholder="10 digit number starting 6-9">
                <small class="error"></small>
            </div>
            <div class="form-group">
                <label>Blood Group *</label>
                <select id="bloodGroup" required>
                    <option value="">Select</option>
                    <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
                    <option>O+</option><option>O-</option><option>AB+</option><option>AB-</option>
                </select>
                <small class="error"></small>
            </div>
            <div class="form-group">
                <label>Hostel Required? *</label>
                <input type="radio" name="hostel" value="Yes"> Yes
                <input type="radio" name="hostel" value="No"> No
                <small class="error"></small>
            </div>
            <div id="guardianSection">
                <h4>Guardian Details</h4>
                <div class="form-group">
                    <label>Guardian Name</label>
                    <input type="text" id="guardianName">
                </div>
                <div class="form-group">
                    <label>Guardian Contact</label>
                    <input type="text" id="guardianContact">
                </div>
            </div>
            <div class="form-btns" style="text-align:right;">
                <button type="button" class="back-btn">Back</button>
                <button type="button" class="next-btn">Next</button>
            </div>
        </div>

        <!-- Step 4: Confirmation -->
        <div class="form-step">
            <h3>Review & Submit</h3>
            <p>Please review all information before submission.</p>
            <div class="form-btns" style="text-align:right;">
                <button type="button" class="back-btn">Back</button>
                <button type="submit" class="submit-btn">Submit</button>
            </div>
        </div>
    </form>

    <div id="confirmation">Form submitted successfully! Thank you for applying.</div>
</div>

<footer>
XYZ University &copy; 2025
</footer>

<script>
$(document).ready(function(){
    let currentStep = 0;
    const steps = $(".form-step");
    const progress = $(".progress-step");

    const electivesOptions = {
        "BSc":["Physics","Chemistry","Maths","Computer Science"],
        "BA":["Economics","History","Political Science","Sociology"],
        "BCom":["Accounting","Finance","Business Studies","Economics"],
        "BTech":["Computer Engineering","Electrical","Mechanical","Civil"],
        "BBA":["Marketing","HR","Finance","International Business"]
    };

    function showStep(i){
        steps.removeClass("step-active");
        steps.eq(i).addClass("step-active");
        progress.removeClass("active");
        progress.eq(i).addClass("active");
        currentStep=i;
    }

    $(".next-btn").click(function(){
        if(validateStep(currentStep)) showStep(currentStep+1);
    });
    $(".back-btn").click(function(){ showStep(currentStep-1); });

    // Focus effect
    $("input, select, textarea").focus(function(){ $(this).css("border-color","#4B2FBF"); })
    .blur(function(){ $(this).css("border-color","#dcd6ff"); });

    // Marks validation
    $("#mark10,#mark12").on("keyup",function(){ 
        this.value=this.value.match(/^\d{0,2}(\.\d{0,2})?/); 
        updateGPA(); 
    });

    function updateGPA(){
        let m10 = parseFloat($("#mark10").val())||0;
        let m12 = parseFloat($("#mark12").val())||0;
        let gpa = ((m10+m12)/2).toFixed(2);
        $("#gpaPreview").text("GPA: "+gpa);
    }

    // Hostel guardian toggle
    $("input[name='hostel']").change(function(){
        if($(this).val()=="Yes") $("#guardianSection").slideDown();
        else $("#guardianSection").slideUp();
    });

    // DOB >=17
    $("#dob").blur(function(){
        const dob = new Date(this.value);
        const age = new Date().getFullYear() - dob.getFullYear();
        if(age<17){ 
            $(this).addClass("invalid").siblings(".error").text("You must be at least 17 years old."); 
        } else { 
            $(this).removeClass("invalid").siblings(".error").text(""); 
        }
    });

    // File preview & size/type check
    $("#marksheet").change(function(){
        if(this.files.length>0){
            let file=this.files[0];
            let sizeMB = file.size/1024/1024;
            let ext = file.name.split('.').pop().toLowerCase();
            if(!["pdf","jpg","jpeg"].includes(ext)){ alert("Invalid file type"); $(this).val(""); $("#filePreview").text(""); return; }
            if(sizeMB>5){ alert("File size must be <=5MB"); $(this).val(""); $("#filePreview").text(""); return; }
            $("#filePreview").text(`Selected file: ${file.name} (${sizeMB.toFixed(2)} MB)`);
        }
    });

    // Course electives
    $("#course").change(function(){
        const course=$(this).val();
        if(electivesOptions[course]){
            let options = electivesOptions[course].map(e=>`<option>${e}</option>`).join('');
            $("#electives").html('<option value="">Select Elective</option>'+options);
            $("#electivesContainer").slideDown();
        } else { $("#electivesContainer").slideUp(); }
    });

    // Step validation function
    function validateStep(step){
        let valid=true;
        steps.eq(step).find("input, select, textarea").each(function(){
            $(this).siblings(".error").text(""); // clear previous error
            if($(this).prop("required") && !$(this).val()){ 
                $(this).addClass("invalid"); 
                $(this).siblings(".error").text("This field is required"); 
                valid=false; 
                return;
            } else { $(this).removeClass("invalid"); }

            // Specific constraints
            if(this.id=="studentName"||this.id=="fatherName"||this.id=="motherName"||this.id=="guardianName"){
                if(!/^[a-zA-Z ]+$/.test($(this).val())){ 
                    $(this).addClass("invalid"); 
                    $(this).siblings(".error").text("Only alphabets allowed"); 
                    valid=false; 
                }
            }

            if(this.id=="mobile"||this.id=="guardianContact"){
                if(!/^[6-9][0-9]{9}$/.test($(this).val())){
                    $(this).addClass("invalid"); 
                    $(this).siblings(".error").text("10 digits, starting 6-9"); 
                    valid=false; 
                }
            }

            if(this.id=="mark10"||this.id=="mark12"){
                let val=parseFloat($(this).val());
                if(isNaN(val) || val<0 || val>100){
                    $(this).addClass("invalid");
                    $(this).siblings(".error").text("Enter valid 0-100 mark");
                    valid=false;
                }
            }

            if(this.id=="address" && !/^[a-zA-Z0-9\s,.-]+$/.test($(this).val())){
                $(this).addClass("invalid");
                $(this).siblings(".error").text("Invalid characters in address");
                valid=false;
            }

        });

        // Electives check
        if($("#electivesContainer").is(":visible") && !$("#electives").val()){ 
            $("#electives").addClass("invalid"); valid=false;
        } else { $("#electives").removeClass("invalid"); }

        return valid;
    }

    // Input constraints on typing
    $("#studentName,#fatherName,#motherName,#guardianName").on("input",function(){ this.value=this.value.replace(/[^a-zA-Z ]/g,''); });
    $("#mobile,#guardianContact").on("input",function(){ this.value=this.value.replace(/[^0-9]/g,''); });
    $("#mark10,#mark12").on("input",function(){ this.value=this.value.replace(/[^0-9.]/g,''); });
    $("#address").on("input",function(){ this.value=this.value.replace(/[^a-zA-Z0-9\s,.-]/g,''); });

    // Form submit
    $("#admissionForm").submit(function(e){
        e.preventDefault();
        if(validateStep(currentStep)){
            $("#admissionForm").fadeOut();
            $("#confirmation").fadeIn();
        } else { alert("Please correct the errors highlighted."); }
    });
});
</script>

</body>
</html>
