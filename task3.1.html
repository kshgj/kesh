<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Admission Form with Live Validation</title>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>
body { font-family:'Roboto', sans-serif; background:#f5f6fa; margin:0; color:#333; }
h2,h3 { text-align:center; color:#4B2FBF; }
.container { max-width: 800px; margin: 40px auto; background:#fff; padding:30px; border-radius:12px; box-shadow:0 6px 18px rgba(0,0,0,0.1); }
header, footer { text-align:center; padding:15px 0; background:#4B2FBF; color:white; font-weight:500; border-radius:8px; margin-bottom:20px; }
.progress-container { display:flex; justify-content:space-between; margin-bottom:30px; }
.progress-step { width:30px; height:30px; background:#dcd6ff; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#4B2FBF; font-weight:bold; transition:0.3s; }
.progress-step.active { background:#4B2FBF; color:white; }
.form-step { display:none; }
.step-active { display:block; }
.form-group { margin-bottom:20px; position:relative; }
label { display:block; font-weight:500; margin-bottom:6px; }
input, select, textarea { width:100%; padding:10px 12px; border:2px solid #dcd6ff; border-radius:6px; font-size:15px; transition: all 0.3s; box-sizing:border-box; }
input:focus, select:focus, textarea:focus { border-color:#4B2FBF; box-shadow:0 0 5px rgba(75,47,191,0.3); outline:none; }
input.invalid, select.invalid, textarea.invalid { border-color:red; }
input.valid, select.valid, textarea.valid { border-color:green; }
.error { color:red; font-size:13px; position:absolute; bottom:-18px; left:0; }
button { background:#4B2FBF; color:white; border:none; padding:12px 25px; border-radius:6px; font-weight:600; cursor:pointer; transition:0.3s; }
button:hover { background:#351fa0; }
button:disabled { background:#999; cursor:not-allowed; }
#guardianSection { display:none; padding:15px; background:#f1f1f1; border-radius:8px; margin-top:10px; }
#filePreview { margin-top:10px; font-size:14px; color:#333; }
#confirmation { display:none; text-align:center; font-size:18px; color:green; margin-top:20px; }
textarea { resize:none; }

/* Step 3 options styling like Google Forms */
.radio-group, .select-group {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    margin-top: 5px;
}
.radio-group label, .select-group label {
    display: flex;
    align-items: center;
    gap: 5px;
    font-weight: 500;
}

@media(max-width:768px){ .container { margin:20px; padding:20px; } }
</style>
</head>
<body>

<header>
<h1>Global University Admission Portal</h1>
</header>

<div class="container">
    <h2>Online Admission Form</h2>
    <div class="progress-container">
        <div class="progress-step active">1</div>
        <div class="progress-step">2</div>
        <div class="progress-step">3</div>
        <div class="progress-step">4</div>
    </div>

    <form id="admissionForm" enctype="multipart/form-data">
        <!-- Step 1 -->
        <div class="form-step step-active">
            <div class="form-group">
                <label>Student Name *</label>
                <input type="text" id="studentName" required>
                <small class="error"></small>
            </div>
            <div class="form-group">
                <label>Date of Birth *</label>
                <input type="date" id="dob" required>
                <small class="error"></small>
            </div>
            <div class="form-group">
                <label>Gender *</label>
                <select id="gender" required>
                    <option value="">Select</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
                <small class="error"></small>
            </div>
            <div class="form-group">
                <label>Father’s Name *</label>
                <input type="text" id="fatherName" required>
                <small class="error"></small>
            </div>
            <div class="form-group">
                <label>Mother’s Name *</label>
                <input type="text" id="motherName" required>
                <small class="error"></small>
            </div>
            <div class="form-btns" style="text-align:right;">
                <button type="button" class="next-btn" disabled>Next</button>
            </div>
        </div>

        <!-- Step 2 -->
        <div class="form-step">
            <div class="form-group">
                <label>Address *</label>
                <textarea id="address" rows="3" required></textarea>
                <small class="error"></small>
            </div>
            <div class="form-group">
                <label>10th Mark % *</label>
                <input type="text" id="mark10" required placeholder="0-100">
                <small class="error"></small>
            </div>
            <div class="form-group">
                <label>12th Mark % *</label>
                <input type="text" id="mark12" required placeholder="0-100">
                <small class="error"></small>
            </div>
            <div class="form-group">
                <label>Course Applying For *</label>
                <select id="course" required>
                    <option value="">Select Course</option>
                    <option value="BSc">B.Sc</option>
                    <option value="BA">B.A</option>
                    <option value="BCom">B.Com</option>
                    <option value="BTech">B.Tech</option>
                    <option value="BBA">BBA</option>
                </select>
                <small class="error"></small>
            </div>
            <div class="form-group" id="electivesContainer" style="display:none;">
                <label>Electives *</label>
                <select id="electives"></select>
                <small class="error"></small>
            </div>
            <div class="form-group">
                <label>Upload Marksheet (≤2MB) *</label>
                <input type="file" id="marksheet" accept=".pdf,.jpg,.jpeg" required>
                <div id="filePreview"></div>
                <small class="error"></small>
            </div>
            <div class="form-btns" style="text-align:right;">
                <button type="button" class="back-btn">Back</button>
                <button type="button" class="next-btn" disabled>Next</button>
            </div>
        </div>

        <!-- Step 3 -->
        <div class="form-step">
            <div class="form-group">
                <label>Email *</label>
                <input type="email" id="email" required>
                <small class="error"></small>
            </div>
            <div class="form-group">
                <label>Mobile *</label>
                <input type="text" id="mobile" required placeholder="10 digit number">
                <small class="error"></small>
            </div>
            <div class="form-group">
                <label>Blood Group *</label>
                <div class="radio-group">
                    <label><input type="radio" name="bloodGroup" value="A+"> A+</label>
                    <label><input type="radio" name="bloodGroup" value="A-"> A-</label>
                    <label><input type="radio" name="bloodGroup" value="B+"> B+</label>
                    <label><input type="radio" name="bloodGroup" value="B-"> B-</label>
                    <label><input type="radio" name="bloodGroup" value="O+"> O+</label>
                    <label><input type="radio" name="bloodGroup" value="O-"> O-</label>
                    <label><input type="radio" name="bloodGroup" value="AB+"> AB+</label>
                    <label><input type="radio" name="bloodGroup" value="AB-"> AB-</label>
                </div>
                <small class="error"></small>
            </div>

            <div class="form-group">
                <label>Hostel Required? *</label>
                <div class="radio-group">
                    <label><input type="radio" name="hostel" value="Yes"> Yes</label>
                    <label><input type="radio" name="hostel" value="No"> No</label>
                </div>
                <small class="error"></small>
            </div>

            <div id="guardianSection">
                <h4>Guardian Details</h4>
                <div class="form-group">
                    <label>Guardian Name</label>
                    <input type="text" id="guardianName">
                    <small class="error"></small>
                </div>
                <div class="form-group">
                    <label>Guardian Contact</label>
                    <input type="text" id="guardianContact">
                    <small class="error"></small>
                </div>
            </div>

            <div class="form-btns" style="text-align:right;">
                <button type="button" class="back-btn">Back</button>
                <button type="button" class="next-btn" disabled>Next</button>
            </div>
        </div>

        <!-- Step 4 -->
        <div class="form-step">
            <h3>Review & Submit</h3>
            <p>Please review all information before submission.</p>
            <div class="form-btns" style="text-align:right;">
                <button type="button" class="back-btn">Back</button>
                <button type="submit" class="submit-btn">Submit</button>
            </div>
        </div>
    </form>

    <div id="confirmation">Form submitted successfully! Thank you for applying.</div>
</div>

<footer>
Global University &copy; 2025
</footer>

<script>
$(document).ready(function(){
    let currentStep = 0;
    const steps = $(".form-step");
    const progress = $(".progress-step");

    const electivesOptions = {
        "BSc":["Physics","Chemistry","Maths","Computer Science"],
        "BA":["Economics","History","Political Science","Sociology"],
        "BCom":["Accounting","Finance","Business Studies","Economics"],
        "BTech":["Computer Engineering","Electrical","Mechanical","Civil"],
        "BBA":["Marketing","HR","Finance","International Business"]
    };

    function showStep(i){
        steps.removeClass("step-active");
        steps.eq(i).addClass("step-active");
        progress.removeClass("active");
        progress.eq(i).addClass("active");
        currentStep=i;
        updateNextBtn();
    }

    $(".next-btn").click(function(){
        if(validateStep(currentStep)) showStep(currentStep+1);
    });
    $(".back-btn").click(function(){ showStep(currentStep-1); });

    $("input, select, textarea").on("input change", function(){ validateStep(currentStep); updateNextBtn(); });

    $("#course").change(function(){
        const course=$(this).val();
        if(electivesOptions[course]){
            let options = electivesOptions[course].map(e=>`<option>${e}</option>`).join('');
            $("#electives").html('<option value="">Select Elective</option>'+options);
            $("#electivesContainer").slideDown(updateNextBtn);
        } else { $("#electivesContainer").slideUp(updateNextBtn); }
    });

    $("input[name='hostel']").change(function(){
        if($(this).val()=="Yes") $("#guardianSection").slideDown(updateNextBtn);
        else $("#guardianSection").slideUp(updateNextBtn);
    });

    // Input restrictions for 10th and 12th marks (0-100, whole numbers only)
    $("#mark10,#mark12").on("input", function() {
        let val = this.value.replace(/[^0-9]/g, ''); // Remove non-digits
        if (val !== "") {
            let num = parseInt(val);
            if (num > 100) num = 100; // Limit max to 100
            this.value = num;
        } else {
            this.value = "";
        }
    });

    $("#marksheet").change(function(){
        if(this.files.length>0){
            let file=this.files[0];
            let sizeMB = file.size / 1024 / 1024;
            if(sizeMB>2){ alert("File must be ≤2MB"); $(this).val(""); $("#filePreview").text(""); return; }
            $("#filePreview").text("Selected file: "+file.name+" ("+sizeMB.toFixed(2)+" MB)");
        }
    });

    $("#studentName,#fatherName,#motherName,#guardianName").on("input",function(){ this.value=this.value.replace(/[^a-zA-Z ]/g,''); });
    $("#mobile,#guardianContact").on("input",function(){ this.value=this.value.replace(/[^0-9]/g,''); });

    $("#admissionForm").submit(function(e){
        e.preventDefault();
        if(validateStep(currentStep)){
            $("#admissionForm").fadeOut();
            $("#confirmation").fadeIn();
        }
    });

    function validateStep(step){
        let valid = true;
        const stepFields = steps.eq(step).find("input, select, textarea").filter(":visible");

        stepFields.each(function(){
            const id = $(this).attr("id");
            const val = $(this).val().trim();
            $(this).removeClass("invalid valid").siblings(".error").text("");

            let fieldValid = true;

            // Required check
            if($(this).prop("required") && val.length==0) fieldValid=false;

            if(val.length>0){
                switch(id){
                    case "studentName": case "fatherName": case "motherName": case "guardianName":
                        if(!/^[a-zA-Z ]+$/.test(val)){ fieldValid=false; $(this).siblings(".error").text("Only alphabets allowed."); }
                        break;
                    case "dob":
                        const dob = new Date(val);
                        const age = new Date().getFullYear() - dob.getFullYear();
                        if(age<17){ fieldValid=false; $(this).siblings(".error").text("You must be at least 17."); }
                        break;
                    case "mark10": case "mark12":
                        const mark = parseInt(val);
                        if(isNaN(mark) || mark<0 || mark>100){ fieldValid=false; $(this).siblings(".error").text("0-100 only"); }
                        break;
                    case "email":
                        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                        if(!emailPattern.test(val)){ fieldValid=false; $(this).siblings(".error").text("Invalid email."); }
                        break;
                    case "mobile": case "guardianContact":
                        if(!/^\d{10}$/.test(val)){ fieldValid=false; $(this).siblings(".error").text("10 digits required."); }
                        break;
                    case "marksheet":
                        if(this.files.length==0){ fieldValid=false; $(this).siblings(".error").text("Required"); }
                        break;
                }
            }

            if(fieldValid && val.length>0) $(this).addClass("valid");
            else if(!fieldValid && val.length>0) $(this).addClass("invalid");

            if(!fieldValid) valid=false;
        });

        // Electives validation
        if($("#electivesContainer").is(":visible") && !$("#electives").val()) valid=false;

        // Hostel radio validation
        if(steps.eq(step).find("input[name='hostel']").length && !$("input[name='hostel']:checked").val()) valid=false;

        return valid;
    }

    function updateNextBtn(){
        const nextBtn = steps.eq(currentStep).find(".next-btn");
        if(validateStep(currentStep)) nextBtn.prop("disabled",false);
        else nextBtn.prop("disabled",true);
    }
});
</script>
</body>
</html>
